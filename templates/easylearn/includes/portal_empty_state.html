{# Uso: {% include "easylearn/includes/portal_empty_state.html" with empty_title="..." empty_text="..." empty_cta_label="..." empty_cta_href="#" %} #}
<div class="portal-empty-state">
  <p class="portal-empty-state__title">{{ empty_title }}</p>
  <p class="portal-empty-state__text">{{ empty_text }}</p>
  {% if empty_cta_label %}
    {% if empty_cta_goto %}
    <button type="button" class="btn-main" data-goto="{{ empty_cta_goto }}">{{ empty_cta_label }}</button>
    {% else %}
    <a class="btn-main" href="{{ empty_cta_href|default:'#' }}">{{ empty_cta_label }}</a>
    {% endif %}
  {% endif %}
</div>
