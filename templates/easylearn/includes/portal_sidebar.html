{% load static %}
<aside class="sidebar" aria-label="Navegación principal">
  <div class="sidebar__head">
    <div class="sidebar__brand">
      <div class="sidebar__brand-frame">
        <a href="{% url 'notes:dashboard' %}" class="sidebar__brand-link" title="EasyLearn — Inicio">
          <img class="sidebar__brand-logo" src="{% static 'easylearn/img/LOGOOOOOOOO (1).png' %}" alt="EasyLearn" width="238" height="80" decoding="async" loading="eager" />
        </a>
      </div>
    </div>
  </div>
  <div class="sidebar__middle">
    <nav class="sidebar__nav" id="sidebar-nav">
    <button type="button" class="sidebar__link is-active" data-route="dashboard" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="sidebar__label">Inicio</span>
    </button>
    <a class="sidebar__link{% if portal_nav == 'cursos' %} is-active{% endif %}" href="{% url 'classroom:course_list' %}"{% if portal_nav == 'cursos' %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span class="sidebar__label">Aula virtual</span>
    </a>
    <button type="button" class="sidebar__link" data-route="calificaciones">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      <span class="sidebar__label">Calificaciones</span>
    </button>
    <button type="button" class="sidebar__link" data-route="calendario">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
      <span class="sidebar__label">Calendario</span>
    </button>
    <button type="button" class="sidebar__link" data-route="mensajes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-4 3V7a4 4 0 0 1 4-4h9a4 4 0 0 1 4 4z"/></svg>
      <span class="sidebar__label">Mensajes</span>
    </button>
    <a class="sidebar__link" href="{% url 'revision:calendar' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span class="sidebar__label">Repaso</span>
    </a>
    </nav>
    <div class="sidebar__collapse-row" role="group" aria-label="Ancho del menú lateral">
      <hr class="sidebar__rule" aria-hidden="true" />
      <button type="button" class="sidebar__collapse" aria-label="Contraer menú lateral" aria-expanded="true" title="Contraer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="sidebar__anchors" aria-label="Configuración y ayuda">
      <a class="sidebar__link sidebar__link--quiet" href="{% url 'profile' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <span class="sidebar__label">Configuración</span>
      </a>
      <a class="sidebar__link sidebar__link--quiet" href="https://www.w3.org/WAI/WCAG21/quickref/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9 9h.01M15 9h.01"/><path d="M9.7 14.3c.45.73 1.15 1.2 2.03 1.2h.54c.88 0 1.58-.47 2.03-1.2"/></svg>
        <span class="sidebar__label">Centro de ayuda</span>
      </a>
      <a class="sidebar__link sidebar__link--quiet" href="https://www.w3.org/WAI/fundamentals/accessibility-intro/es" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/></svg>
        <span class="sidebar__label">Accesibilidad</span>
      </a>
    </div>
    <div class="sidebar__middle-fill" aria-hidden="true"></div>
  </div>
</aside>
